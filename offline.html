<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline - JDB</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font-family: sans-serif; text-align: center; padding: 1rem; box-sizing: border-box; }
  h1 { font-size: 1.4rem; margin: 0 0 .5rem; }
  p { margin: .3rem 0; opacity: .8; }
  button { margin-top: 1rem; padding: .5rem 1.2rem; font-size: 1rem; cursor: pointer; }
</style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p>離線中 / オフライン</p>
    <p>This page hasn't been cached yet. Reconnect and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </main>
</body>
</html>
