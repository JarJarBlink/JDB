<script src="static/js/tools/stuff.js"></script>

<link rel="stylesheet" href="static/dark-mode-toggle/light.css" media="(prefers-color-scheme: light)"/>

<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
    --stroke:      2.5px;
    --radius-card: 10px;
    --radius-btn:  8px;
    --font-head:   'Dela Gothic One', 'Noto Sans TC', 'Noto Sans KR', sans-serif;
    --font-body:   'Noto Sans TC', 'Noto Sans KR', sans-serif;

}

html, body {
    color: var(--bc-ink) !important;
    font-family: var(--font-body) !important;
    font-size: 13px;
}

article {
    background: var(--bc-cream) !important;
    max-width: 760px;
    margin: 0 auto;
    padding-bottom: 60px;
    position: relative;
    min-height: 100vh;
}

/* ── Title banner ── */
article > h2 {
    font-family: var(--font-head) !important;
    font-size: 1.3rem !important;
    font-weight: 400 !important;
    letter-spacing: 0.04em;
    color: var(--bc-title-text) !important;
    background: var(--bc-title-bg) !important;
    border: none !important;
    border-bottom: var(--stroke) solid var(--bc-border) !important;
    padding: 12px 16px 10px !important;
    margin: 0;
    text-shadow: 1px 2px 0 rgba(0,0,0,0.35);
}

article > img {
    display: block;
    max-width: calc(100% - 20px);
    height: auto;
    margin: 10px auto 0;
    border-radius: var(--radius-card);
    border: var(--stroke) solid var(--bc-border);
    box-shadow: var(--shadow-card);
}

article > h3 {
    font-family: var(--font-head) !important;
    font-size: 0.95rem !important;
    font-weight: 400 !important;
    letter-spacing: 0.06em;
    color: var(--bc-title-text) !important;
    background: var(--bc-h3-bg) !important;
    border: none !important;
    border-top: var(--stroke) solid var(--bc-border) !important;
    border-bottom: var(--stroke) solid var(--bc-border) !important;
    padding: 7px 14px !important;
    margin: 14px 0 0;
    text-shadow: 1px 1px 0 rgba(0,0,0,0.3);
}

/* ── Region tabs ── */
.region-bar {
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    gap: 6px;
    padding: 8px 10px;
    background: var(--bc-cream);
    border-bottom: 1.5px dashed var(--bc-border);
    overflow-x: auto;
    scrollbar-width: none;
}
.region-bar::-webkit-scrollbar { display: none; }

.region-tab {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-head);
    font-size: 0.78rem;
    color: var(--bc-ink);
    background: var(--bc-cream2);
    border: var(--stroke) solid var(--bc-border);
    border-radius: var(--radius-btn);
    padding: 5px 12px;
    cursor: pointer;
    box-shadow: var(--shadow-btn);
    transition: transform 0.12s, box-shadow 0.12s;
}
.region-tab:hover { transform: translateY(-2px); box-shadow: 2px 5px 0 var(--bc-border); }
.region-tab:focus-visible { outline: 3px solid var(--bc-ink); outline-offset: 2px; }
.region-tab[aria-pressed="true"] {
    background: var(--bc-h3-bg);
    color: var(--bc-title-text);
    transform: translateY(1px);
    box-shadow: 1px 1px 0 var(--bc-border);
}

/* ── Log area ── */
#stage0_block { padding: 4px 10px 0; }
#stage0_block .name { margin: 0; }

#stage0_block > hr { display: none; }   /* 分隔線改由卡片間距取代 */

/* ── Region card (details) ── */
#stage0_block details {
    background: var(--bc-cream);
    border: var(--stroke) solid var(--bc-border);
    border-radius: var(--radius-card);
    margin: 12px 0 0;
    overflow: hidden;
    box-shadow: var(--shadow-card);
}
#stage0_block details[hidden] { display: none; }

#stage0_block summary {
    list-style: none;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    font-family: var(--font-head);
    font-size: 0.9rem;
    letter-spacing: 0.05em;
    color: var(--bc-title-text);
    background: var(--bc-h3-bg);
    padding: 8px 14px;
    text-shadow: 1px 1px 0 rgba(0,0,0,0.3);
    user-select: none;
}
#stage0_block summary::-webkit-details-marker { display: none; }
#stage0_block summary strong { font-weight: 400; flex: 1; }
#stage0_block summary::after {
    content: '▾';
    transition: transform 0.15s;
}
#stage0_block details:not([open]) summary::after { transform: rotate(-90deg); }
#stage0_block details[open] summary { border-bottom: var(--stroke) solid var(--bc-border); }
#stage0_block summary:focus-visible { outline: 3px solid var(--bc-ink); outline-offset: -3px; }

/* count badge（由下方 script 填入） */
.count-badge {
    font-family: var(--font-body);
    font-size: 0.7rem;
    background: var(--bc-cream);
    color: var(--bc-ink);
    border: 1.5px solid var(--bc-border);
    border-radius: 20px;
    padding: 0 8px;
    text-shadow: none;
}

/* ── Version list → rows ── */
#stage0_block details ul {
    list-style: none;
    margin: 0;
    padding: 10px 12px 12px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 8px;
}
#stage0_block details ul > * {
    position: relative !important;
    overflow: hidden;
    margin: 0;
    padding: 0;
    background: var(--bc-cream2);
    border: var(--stroke) solid var(--bc-border) !important;
    border-radius: 7px;
    box-shadow: 2px 3px 0 var(--bc-border);
    transition: transform 0.12s, box-shadow 0.12s;
    line-height: 1.5;
}
#stage0_block details ul > a,
#stage0_block details ul > button {
    display: block;
    padding: 7px 10px;
    color: var(--bc-ink) !important;
    text-decoration: none;
    font-weight: 500;
}
#stage0_block details li:hover,
#stage0_block details ul > *:hover {
    transform: translateY(-2px);
    box-shadow: 2px 5px 0 var(--bc-border);
}
#stage0_block details li > a,
#stage0_block details li > span {
    display: block;
    padding: 7px 10px;
    color: var(--bc-ink) !important;
    text-decoration: none;
    font-weight: 500;
    word-break: break-word;
}
#stage0_block details li > a:focus-visible { outline: 3px solid var(--bc-ink); outline-offset: -3px; }
#stage0_block details li:not(:has(a, button, span)) { padding: 7px 10px; }
#stage0_block details ul:empty { display: block; }
#stage0_block details ul:empty::before {
    content: 'No log yet';
    display: block;
    text-align: center;
    padding: 14px 0;
    opacity: 0.6;
}

/* ── Bottom contact bar ── */
.contact { position: absolute; bottom: 10px; left: 10px; z-index: 100; }
.contact ul { list-style: none; padding: 0; margin: 0; }
.contact li a {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    font-family: var(--font-head);
    color: var(--bc-ink) !important;
    text-decoration: none;
    background: var(--bc-cream2);
    border: var(--stroke) solid var(--bc-border);
    border-radius: var(--radius-btn);
    padding: 3px 10px;
    box-shadow: var(--shadow-btn);
    transition: transform 0.12s, box-shadow 0.12s;
}
.contact li a:hover { transform: translateY(-2px); box-shadow: 2px 5px 0 var(--bc-border); }

dark-mode-toggle.slider { display: none !important; }

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bc-cream); }
::-webkit-scrollbar-thumb { background: var(--bc-ink-mid); border-radius: 3px; border: 1px solid var(--bc-border); }

@media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
}
</style>
</head>
<body>
<article>
  <h2>VERSION UPDATE</h2>
  <img src="static/img/update_en.png" alt="">

  <h3>Log</h3>

  <nav class="region-bar" id="regionBar" aria-label="Region filter">
    <button type="button" class="region-tab" data-region="all" aria-pressed="true">ALL</button>
    <button type="button" class="region-tab" data-region="ja" aria-pressed="false">JA</button>
    <button type="button" class="region-tab" data-region="tw" aria-pressed="false">TW</button>
    <button type="button" class="region-tab" data-region="en" aria-pressed="false">EN</button>
    <button type="button" class="region-tab" data-region="kr" aria-pressed="false">KO</button>
  </nav>

  <div id="stage0_block" class="block">
    <p class="name"></p>
    <details open id="ja">
      <summary><strong>JA VER.</strong></summary>
      <ul></ul>
    </details>
    <details open id="tw">
      <summary><strong>TW VER.</strong></summary>
      <ul></ul>
    </details>
    <details open id="en">
      <summary><strong>EN VER.</strong></summary>
      <ul></ul>
    </details>
    <details open id="kr">
      <summary><strong>KO VER.</strong></summary>
      <ul></ul>
    </details>

    <div style="height:8rem;"></div>
    <div class="contact">
      <ul>
        <li id="contact1"><a href='index.html' rel="noopener"><img src="static/img/icon/bottom_bg01.png" width="18" class="icon" alt=""/>Home</a></li>
        <li id="contact2">　</li>
      </ul>
    </div>
  </div>
</article>

<script>
(function () {
    var REGIONS = ['ja', 'tw', 'en', 'kr'];
    var KEY = 'table_region';
    var bar = document.getElementById('regionBar');
    var tabs = bar.querySelectorAll('.region-tab');

    function apply(region) {
        REGIONS.forEach(function (r) {
            var d = document.getElementById(r);
            if (d) d.hidden = !(region === 'all' || region === r);
        });
        tabs.forEach(function (t) {
            t.setAttribute('aria-pressed', String(t.dataset.region === region));
        });
        try { localStorage.setItem(KEY, region); } catch (e) {}
    }

    bar.addEventListener('click', function (e) {
        var btn = e.target.closest('.region-tab');
        if (btn) apply(btn.dataset.region);
    });

    function updateBadge(id) {
        var d = document.getElementById(id);
        if (!d) return;
        var ul = d.querySelector('ul');
        var badge = d.querySelector('.count-badge');
        if (!badge) {
            badge = document.createElement('span');
            badge.className = 'count-badge';
            d.querySelector('summary').insertBefore(badge, null);
        }
        badge.textContent = ul.children.length;
        badge.hidden = ul.children.length === 0;
    }

    REGIONS.forEach(function (r) {
        var ul = document.querySelector('#' + r + ' ul');
        if (!ul) return;
        updateBadge(r);
        new MutationObserver(function () { updateBadge(r); })
            .observe(ul, { childList: true });
    });

    var saved = 'all';
    try { saved = localStorage.getItem(KEY) || 'all'; } catch (e) {}
    apply(saved);
})();
</script>
</body>
</html>
