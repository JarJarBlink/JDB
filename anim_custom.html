<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=1">
<title>JAR Battle Cats Database</title>
<link rel="icon" href="static/favicon.ico">
<link rel="preload" href="./static/js/anim_wasm/anim_wasm_bg.wasm" as="fetch" crossorigin>
<link rel="stylesheet" href='static/css/database/anim/anim.css'>
<script src="https://code.jquery.com/jquery-3.7.1.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@msgpack/msgpack@3.0.0-beta2/dist.es5+umd/msgpack.min.js" defer></script>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-4C7WJXPKMY"></script>
<script src="static/js/home/ga.js" defer></script>
<script>
/*Coded by Exodia JAR. Contact me: https://x.com/eUqQxBRzSbCq7Uz */
const _origGetContext = HTMLCanvasElement.prototype.getContext;
HTMLCanvasElement.prototype.getContext = function(type, attributes) {if (type === '2d') {attributes = Object.assign({ willReadFrequently: true }, attributes || {});}return _origGetContext.call(this, type, attributes);};
</script>
<style>
#custom-upload-overlay{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;background:rgba(0,0,0,.88);overflow:auto}
#custom-upload-overlay .up-card{width:min(460px,100%);max-height:100%;overflow:auto;box-sizing:border-box;padding:22px;border-radius:16px;background:#1b1b1f;border:1px solid rgba(255,255,255,.12);box-shadow:0 0 50px rgba(0,0,0,.6);color:#ddd;font-size:13px}
#custom-upload-overlay h3{margin:0 0 4px;color:#ffcc00;letter-spacing:1px;font-size:18px}
#custom-upload-overlay .up-sub{margin:0 0 14px;color:#888;font-size:12px;line-height:1.5}
#drop-zone{display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 12px;border:2px dashed rgba(255,255,255,.25);border-radius:12px;background:rgba(255,255,255,.04);text-align:center;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:.15s}
#drop-zone.over,#drop-zone:active{border-color:#ffcc00;background:rgba(255,204,0,.08)}
#drop-zone .dz-icon{font-size:30px}
#drop-zone .dz-main{font-size:15px;color:#fff;font-weight:600}
#drop-zone .dz-hint{font-size:11px;color:#888}
#file-list-preview{margin-top:14px;padding:12px;min-height:64px;border-radius:8px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1);font-family:'Courier New',monospace;font-size:12px;line-height:1.7;color:#ddd}
#btn-build-asset{display:block;width:100%;margin-top:16px;padding:14px;border:0;border-radius:10px;background:#ffcc00;color:#000;font-size:15px;font-weight:700;cursor:pointer}
#btn-build-asset:active{filter:brightness(.9)}
#up-status{margin:10px 0 0;min-height:1.2em;text-align:center;font-size:12px;color:#ffcc00}
</style>
</head>
<body>
    <div class="animation-container" id="container">
        <input type="file" id="bg-input" accept="image/*" style="display:none;">
        <div id="gesture-hint">Drag to move · Scroll / pinch to zoom · Double-click to reset</div>

        <!-- ════════════════════════════════
             底部 Dock
        ════════════════════════════════ -->
        <div id="mobile-bottom-bar">

            <!-- 快捷列（收合時顯示）：型態 + 動作，不用展開就能切換 -->
            <div id="mobile-quick-row">
                <div id="quick-forms" role="group" aria-label="Form"></div>
                <div id="quick-modes" role="group" aria-label="Animation"></div>
            </div>

            <!-- 常駐列：播放 / 時間軸 / 展開 -->
            <div id="mobile-bar-handle">
                <button id="mobile-play-btn" type="button" aria-label="Play / Pause">▶</button>
                <input id="mobile-frame-slider" type="range" min="0" max="0" value="0" step="1" aria-label="Frame">
                <span id="mobile-frame-display">0 / 0</span>
                <div id="mobile-bar-toggle" aria-hidden="true">▲</div>
            </div>

            <!-- 展開內容（三個分頁） -->
            <div id="mobile-bar-content">

                <div id="dock-tabs" role="tablist">
                    <button class="dock-tab active" type="button" data-tab="anim">🎞 Animation</button>
                    <button class="dock-tab" type="button" data-tab="view">View</button>
                    <button class="dock-tab" type="button" data-tab="export">📤 Export</button>
                </div>

                <!-- Animation -->
                <div class="dock-pane active" id="pane-anim">
                    <div id="mobile-form-row"></div>
                    <div id="mobile-frame-row">
                        <select class="select-mode" id="mobile-mode-select"></select>
                        <div class="frame-group">
                            <button class="frame-adjust-btn" type="button" id="mobile-frame-minus" aria-label="Previous frame">-</button>
                            <input class="input-frame" id="mobile-frame-input" type="number" value="0" min="0">
                            <button class="frame-adjust-btn" type="button" id="mobile-frame-plus" aria-label="Next frame">+</button>
                        </div>
                    </div>
                </div>

                <!-- View -->
                <div class="dock-pane" id="pane-view">
                    <div id="mobile-camera-row">
                        <button class="custom-btn" type="button" id="mb-zoom-in">＋ Zoom</button>
                        <button class="custom-btn" type="button" id="mb-zoom-out">－ Zoom</button>
                        <button class="custom-btn" type="button" id="mb-reset-view">↺ Reset view</button>
                        <button class="custom-btn" type="button" id="mb-upload-bg">Upload BG</button>
                        <button class="custom-btn" type="button" id="mb-reset-bg" style="display:none;">✕ Delete BG</button>
                    </div>
                </div>

                <!-- Export -->
                <div class="dock-pane" id="pane-export">
                    <div class="ui-label">Output size</div>
                    <div class="seg" id="mb-fit-row" role="radiogroup">
                        <button class="seg-btn active" type="button" data-fit="auto">✨ Auto-fit</button>
                        <button class="seg-btn" type="button" data-fit="full">⛶ Full view</button>
                        <button class="seg-btn" type="button" data-fit="manual">✂️ Manual crop</button>
                    </div>
                    <div id="mb-fit-hint"></div>

                    <div id="mobile-export-row">
                        <button class="custom-btn" type="button" id="mb-png-trans">PNG (Transparent)</button>
                        <button class="custom-btn" type="button" id="mb-png-full">PNG (With BG)</button>
                        <button class="custom-btn" type="button" id="mb-webm-full">🎬 WebM</button>
                        <button class="custom-btn" type="button" id="mb-gif-full">🎬 GIF</button>
                    </div>

                    <div id="mb-export-status" role="status" aria-live="polite"></div>
                </div>

            </div>
        </div>

    </div>

    <!-- Upload Overlay: kept outside #container so canvas drag / pointer capture cannot intercept it -->
    <div id="custom-upload-overlay">
        <div class="up-card">
            <h3>Battle Cats Asset Loader</h3>
            <p class="up-sub">Select all files at once: .png, .imgcut, .mamodel, .maanim<br>For multiple forms, include _f / _c / _s / _u in the file names</p>

            <label id="drop-zone" for="batch-upload">
                <span class="dz-icon">📁</span>
                <span class="dz-main">Tap to choose files</span>
                <span class="dz-hint">On desktop you can also drag &amp; drop files here</span>
            </label>
            <input type="file" id="batch-upload" multiple style="display:none;">

            <div id="file-list-preview"><span style="color:#666;">Waiting for files...</span></div>

            <button id="btn-build-asset" type="button">BUILD &amp; PLAY</button>
            <p id="up-status" role="status"></p>
        </div>
    </div>
    <script>
    // Drag &amp; drop: put the files into the input and fire change so custom_upload.js handles them as usual
    (function () {
        const dz = document.getElementById('drop-zone'), inp = document.getElementById('batch-upload');
        ['dragenter', 'dragover'].forEach(t => dz.addEventListener(t, e => { e.preventDefault(); dz.classList.add('over'); }));
        ['dragleave', 'drop'].forEach(t => dz.addEventListener(t, e => { e.preventDefault(); dz.classList.remove('over'); }));
        dz.addEventListener('drop', e => {
            if (!e.dataTransfer.files.length) return;
            inp.files = e.dataTransfer.files;
            inp.dispatchEvent(new Event('change', { bubbles: true }));
        });
    })();
    </script>

    <script src="static/js/anim/engine.js" defer></script>
    <script src="static/js/anim/viewer_wasm.js" defer></script>
    <script src="static/js/anim/viewer_export.js" defer></script>
    <script src="static/js/anim/control.js" defer></script>
    <script src="static/js/anim/custom_upload.js" defer></script>
    <script type="module">
        console.log("Coded by Exodia JAR")
        import init, { AnimEngine } from './static/js/anim_wasm/anim_wasm.js';
        try {
            await init();
            window.AnimEngine = AnimEngine;
            notifyWasmReady();
        } catch (e) {
            notifyWasmFailed(e);
        }
    </script>
</body>
</html>
